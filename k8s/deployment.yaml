apiVersion: v1
kind: ConfigMap
metadata:
  name: connectme-config
  namespace: default
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  PORT: "8000"
  DB_HOST: "connectme-mysql.internal"
  DB_PORT: "3306"
  DB_NAME: "connectme_db"
  UPLOAD_DIRECTORY: "/app/secure_media"
  MAX_UPLOAD_SIZE_BYTES: "5242880"
---
apiVersion: v1
kind: Secret
metadata:
  name: connectme-secret
  namespace: default
type: Opaque
stringData:
  DB_USER: "aparichit"
  DB_PASSWORD: "letmelogin"
  JWT_SECRET_KEY: "8f4e2b1c6d9a0e5f7a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectme-api
  namespace: default
  labels:
    app: connectme
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: connectme
  template:
    metadata:
      labels:
        app: connectme
        tier: api
    spec:
      # Hardened Pod Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connectme-container
          image: connectme:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # Container Level Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: connectme-config
            - secretRef:
                name: connectme-secret
          volumeMounts:
            - name: media-storage
              mountPath: /app/secure_media
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: media-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: connectme-service
  namespace: default
  labels:
    app: connectme
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: connectme
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connectme-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: connectme
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: ingress
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
