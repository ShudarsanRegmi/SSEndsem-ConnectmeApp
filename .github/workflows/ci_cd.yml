name: ConnectMe DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Stage 1: Static Application Security Testing (SAST)
  security_sast:
    name: Security & SAST Analysis (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r ./app -ll -ii -f screen

      - name: Run Semgrep OWASP Security Rules
        run: |
          semgrep --config="p/security-audit" --config="p/owasp-top-ten" --error ./app

  # Stage 2: Automated Testing (Unit, Integration, Fuzzing)
  automated_tests:
    name: Automated Unit, Integration and Fuzz Tests
    runs-on: ubuntu-latest
    needs: security_sast
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: connectme_db
          MYSQL_USER: aparichit
          MYSQL_PASSWORD: letmelogin
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install httpx httpx2

      - name: Execute Pytest Suite with Coverage
        env:
          APP_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: aparichit
          DB_PASSWORD: letmelogin
          DB_NAME: connectme_db
          JWT_SECRET_KEY: 8f4e2b1c6d9a0e5f7a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing -v

  # Stage 3: Container Build and Trivy Image Security Scan
  container_security_build:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: automated_tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Production Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t connectme:${{ github.sha }} -t connectme:latest .

      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'connectme:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Stage 4: Deploy to AWS Staging ECS Fargate
  deploy_staging:
    name: Deploy to AWS Staging (ECS Fargate 4GB)
    runs-on: ubuntu-latest
    needs: container_security_build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to Staging ECS Fargate
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Deploying ConnectMe application to AWS Staging ECS Fargate (1 vCPU, 4GB RAM)..."
          aws ecs update-service --cluster connectme-staging-cluster --service connectme-staging-service --force-new-deployment --region ap-southeast-2

      - name: Skip Deployment Notice
        if: env.AWS_ACCESS_KEY_ID == ''
        run: |
          echo "AWS_ACCESS_KEY_ID secret not configured in GitHub repository. Deployment skipped in CI."

  # Stage 5: Deploy to AWS Production ECS Fargate
  deploy_production:
    name: Deploy to AWS Production (ECS Fargate 4GB)
    runs-on: ubuntu-latest
    needs: container_security_build
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to Production ECS Fargate
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Deploying ConnectMe application to AWS Production ECS Fargate (1 vCPU, 4GB RAM)..."
          aws ecs update-service --cluster connectme-production-cluster --service connectme-production-service --force-new-deployment --region ap-southeast-2

      - name: Skip Deployment Notice
        if: env.AWS_ACCESS_KEY_ID == ''
        run: |
          echo "AWS_ACCESS_KEY_ID secret not configured in GitHub repository. Deployment skipped in CI."
